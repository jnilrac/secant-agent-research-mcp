name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install package
        run: python -m pip install .

      - name: Validate package and MCP module
        run: |
          python -m compileall server.py
          python - <<'PY'
          import server

          assert server.API_BASE_URL == "https://agentic.secantoutreach.com"
          assert server.mcp is not None
          print("Secant Agent Research MCP imports successfully.")
          PY

      - name: Validate Docker build
        run: docker build -t secant-agent-research-mcp .
