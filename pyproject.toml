[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "secant-agent-research-mcp"
version = "0.1.0"
description = "MCP wrapper for the Secant Agent Research Pack x402 API."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=2.14,<3",
    "httpx>=0.27,<1",
]

[project.scripts]
secant-agent-research-mcp = "server:main"

[tool.setuptools]
py-modules = ["server"]
